name: Python experiments

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Due-diligence control tests
        run: python -m pytest experiments/due_diligence_control/test_smoke.py -q
      - name: Bilateral exposure control tests
        run: |
          if [ -f experiments/bilateral_exposure_control/test_smoke.py ]; then
            python -m pytest experiments/bilateral_exposure_control/test_smoke.py -q
          else
            echo "bilateral package not on this branch — skip"
          fi
