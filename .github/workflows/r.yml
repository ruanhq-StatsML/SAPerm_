# R package check. Keep versions that current macOS runners can still download.
name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.6.3 is no longer published for current macOS runners (404).
        r-version: ['4.3.3', '4.4.2']

    steps:
      - uses: actions/checkout@v4
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          # This repo is primarily Python experiments; skip hard fail if no DESCRIPTION.
          if (file.exists("DESCRIPTION")) {
            remotes::install_deps(dependencies = TRUE)
          } else {
            message("No DESCRIPTION — skipping remotes::install_deps")
          }
        shell: Rscript {0}
      - name: Check
        run: |
          if (file.exists("DESCRIPTION")) {
            rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
          } else {
            message("No DESCRIPTION — R check no-op (Python-first repo)")
          }
        shell: Rscript {0}
