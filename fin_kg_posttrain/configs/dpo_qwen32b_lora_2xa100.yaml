### model
model_name_or_path: /models/Qwen2.5-32B-Instruct
adapter_name_or_path: saves/qwen2.5-32b-fin-kg/lora/sft

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1

### dataset
dataset: fin_kg_dpo
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: saves/qwen2.5-32b-fin-kg/lora/dpo
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
deepspeed: configs/ds_z2_config.json
